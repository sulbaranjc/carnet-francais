<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Carnet visuel et sonore pour apprendre le français.">
  <title>Mon carnet de français</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <p class="eyebrow">MON CARNET DE FRANÇAIS · AUDIO</p>
      <h1>Écouter et répéter</h1>
      <p class="intro">Appuie sur le bouton vert, écoute, puis répète le mot à voix haute.</p>
      <p class="learning-signature">J’apprends le français avec Juan Carlos.</p>
    </header>

    <aside class="voice-note" aria-label="Information sur la voix">
      Voix française masculine · <strong>fr-FR-HenriNeural</strong>.
    </aside>

    <section class="search-panel" aria-labelledby="search-title">
      <div>
        <p id="search-title" class="eyebrow">RECHERCHER</p>
        <label class="search-label" for="word-search">Quel mot veux-tu pratiquer ?</label>
      </div>
      <input
        id="word-search"
        class="search-input"
        type="search"
        name="word-search"
        placeholder="Commence par une lettre…"
        autocomplete="off"
        aria-describedby="search-status"
      >
      <p id="search-status" class="search-status" aria-live="polite">Chargement des mots…</p>
    </section>

    <section id="vocabulary-grid" class="vocabulary-grid" aria-label="Mots avec prononciation"></section>

    <noscript>
      <p class="no-script-message">Active JavaScript pour charger les mots du carnet.</p>
    </noscript>

    <footer class="site-footer">Mon carnet de français · Version audio</footer>
  </main>
</body>
</html>
